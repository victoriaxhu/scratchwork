# Checks Lean files in attempts on every push and pull request, then refreshes the site.
name: Check
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Find Lean files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.find.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          files=$(git ls-files 'problems/*/attempts/*.lean' | tr '\n' ' ')
          echo "Lean files: ${files:-none}"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  lean:
    name: Lean check
    needs: detect
    if: needs.detect.outputs.files != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Download Mathlib build cache
        run: lake exe cache get
      - name: Check each file (errors or sorry fail the check)
        env:
          FILES: ${{ needs.detect.outputs.files }}
        run: |
          status=0
          for f in $FILES; do
            echo "::group::$f"
            set +e; out=$(lake env lean "$f" 2>&1); code=$?; set -e
            echo "$out"
            echo "::endgroup::"
            if [ $code -ne 0 ]; then echo "::error file=$f::Lean rejected this file"; status=1; fi
            if echo "$out" | grep -q "declaration uses 'sorry'"; then echo "::error file=$f::File uses sorry"; status=1; fi
          done
          exit $status

  refresh-site:
    name: Refresh site
    needs: [detect, lean]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
